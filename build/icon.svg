<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Icone Medias Rename.
    Canevas 1024 aux proportions macOS : la tuile occupe 824 px centres, soit
    100 px de marge, avec un rayon de 185 (22,5 %). Le meme fichier sert de
    source a l'icns, a l'ico et au png Linux.

    Lecture : la tuile est la pellicule (perforations haut et bas), le cadran
    au centre porte la date de prise de vue. A 16 px les perforations se
    fondent en un lisere, le cadran clair reste identifiable.
  -->
  <defs>
    <linearGradient id="film" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4351"/>
      <stop offset="0.55" stop-color="#2A2B31"/>
      <stop offset="1" stop-color="#161920"/>
    </linearGradient>

    <!-- Halo ambre : rappelle la lumiere sur l'emulsion et rechauffe le gris. -->
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.56">
      <stop offset="0" stop-color="#F0A83C" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#E8A33D" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.42" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCF8F0"/>
      <stop offset="1" stop-color="#EBE1CE"/>
    </linearGradient>

    <clipPath id="tile">
      <rect x="100" y="100" width="824" height="824" rx="185" ry="185"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#film)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>

    <!-- Perforations : 6 par rangee, calees pour ne pas mordre les angles. -->
    <g fill="#F6F1E7" fill-opacity="0.92">
      <rect x="140" y="180" width="64" height="50" rx="16"/>
      <rect x="276" y="180" width="64" height="50" rx="16"/>
      <rect x="412" y="180" width="64" height="50" rx="16"/>
      <rect x="548" y="180" width="64" height="50" rx="16"/>
      <rect x="684" y="180" width="64" height="50" rx="16"/>
      <rect x="820" y="180" width="64" height="50" rx="16"/>

      <rect x="140" y="794" width="64" height="50" rx="16"/>
      <rect x="276" y="794" width="64" height="50" rx="16"/>
      <rect x="412" y="794" width="64" height="50" rx="16"/>
      <rect x="548" y="794" width="64" height="50" rx="16"/>
      <rect x="684" y="794" width="64" height="50" rx="16"/>
      <rect x="820" y="794" width="64" height="50" rx="16"/>
    </g>
  </g>

  <!-- Lisere interieur : detache la tuile d'un fond sombre. -->
  <rect x="101" y="101" width="822" height="822" rx="184" ry="184"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>

  <!-- Cadran -->
  <circle cx="512" cy="512" r="200" fill="url(#face)"/>

  <!-- Index : les quatre cardinaux plus marques pour rester lisibles en petit. -->
  <g fill="#6E6553">
    <rect x="503" y="336" width="18" height="46" rx="9" transform="rotate(0 512 512)"/>
    <rect x="503" y="336" width="18" height="46" rx="9" transform="rotate(90 512 512)"/>
    <rect x="503" y="336" width="18" height="46" rx="9" transform="rotate(180 512 512)"/>
    <rect x="503" y="336" width="18" height="46" rx="9" transform="rotate(270 512 512)"/>
  </g>
  <g fill="#A79C86">
    <rect x="505" y="336" width="14" height="34" rx="7" transform="rotate(30 512 512)"/>
    <rect x="505" y="336" width="14" height="34" rx="7" transform="rotate(60 512 512)"/>
    <rect x="505" y="336" width="14" height="34" rx="7" transform="rotate(120 512 512)"/>
    <rect x="505" y="336" width="14" height="34" rx="7" transform="rotate(150 512 512)"/>
    <rect x="505" y="336" width="14" height="34" rx="7" transform="rotate(210 512 512)"/>
    <rect x="505" y="336" width="14" height="34" rx="7" transform="rotate(240 512 512)"/>
    <rect x="505" y="336" width="14" height="34" rx="7" transform="rotate(300 512 512)"/>
    <rect x="505" y="336" width="14" height="34" rx="7" transform="rotate(330 512 512)"/>
  </g>

  <!-- Aiguilles a 10 h 10 : ouvertes vers le haut, elles ne masquent pas
       le centre et laissent le cadran lisible. -->
  <g stroke="#23262F" stroke-linecap="round">
    <line x1="537" y1="529" x2="422" y2="449" stroke-width="30"/>
    <line x1="486" y1="527" x2="644" y2="436" stroke-width="22"/>
  </g>
  <circle cx="512" cy="512" r="18" fill="#23262F"/>
  <circle cx="512" cy="512" r="7" fill="#E8A33D"/>
</svg>
