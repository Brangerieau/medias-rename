name: Release

# Chaque tag `v*` produit les binaires des trois plateformes
# et les publie dans une release GitHub portant le nom du tag.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Une plateforme qui echoue ne doit pas annuler les deux autres.
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            args: --mac --x64 --arm64
          - name: Linux
            os: ubuntu-latest
            args: --linux
          - name: Windows
            os: windows-latest
            args: --win

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Align the package version with the tag
        shell: bash
        run: npm pkg set version="${GITHUB_REF_NAME#v}"

      - name: Package
        shell: bash
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # Pas de certificat Developer ID : on desactive la signature macOS
          # plutot que de laisser electron-builder echouer dessus.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml

  release:
    name: Publish the GitHub release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
